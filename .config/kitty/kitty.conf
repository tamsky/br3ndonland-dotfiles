# https://sw.kovidgoyal.net/kitty/conf.html
### -- personal options
macos_option_as_alt yes
copy_on_select yes
update_check_interval 0
shell_integration no-cursor
shell /opt/homebrew/bin/bash -l

startup_session s6
# for debugging ENV
# map f1 show_kitty_env_vars

# xterm equivalent of option+LEFT = MOUSE3 (middle)
#mouse_map option+left click ungrabbed paste_from_selection
  # 'click' = bad??

# is 'release' = better?
mouse_map option+left release ungrabbed paste_from_selection

map cmd+shift+v paste_from_clipboard

### ----------- Tabs ---------------- ###
map cmd+option+left move_tab_backward
map cmd+option+right move_tab_forward

#editor /opt/homebrew/bin/emacs

### -------------------------------- Fonts -------------------------------- ###
# consider "Fira Code"
#font_family Inconsolata

# working:
font_family family="Iosevka Term"
bold_font auto
italic_font auto
bold_italic_font auto

# bold_italic_font family='Courier New' postscript_name=CourierNewPS-BoldItalicMT
# bold_italic_font family='Menlow' postscript_name=MenlowPS-BoldItalicMT
# bold_italic_font family='Iosevka'
font_size 18.0
disable_ligatures never
adjust_line_height 100%
# macos_thicken_font 0.0

# modify_font underline_thickness 150%
# modify_font underline_position 2px
# modify_font cell_height -2
# modify_font cell_width 100%
# modify_font baseline 0
# modify_font strikethrough_thickness 150%
# modify_font strikethrough_position 1


### ------------------------- Cursor customization ------------------------ ###
cursor #00ff00
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 500

### ------------------------------ Scrollback ----------------------------- ###
scrollback_lines 30000

### ---------------------------- Terminal bell ---------------------------- ###
enable_audio_bell no
bell_on_tab yes
visual_bell_duration 0.0
window_alert_on_bell yes

### ---------------------------- Window layout ---------------------------- ###
confirm_os_window_close 1
enabled_layouts vertical, horizontal, grid
hide_window_decorations no
remember_window_size yes
window_padding_width 1

### ------------------------------- Tab bar ------------------------------- ###
tab_bar_edge bottom
# tab_bar_style: [ fade slant separator powerline custom hidden ]
tab_bar_style fade
tab_bar_min_tabs 2
tab_separator " ┇"
tab_switch_strategy previous
#tab_title_template "{index}: {'/'.join(title.split('/')[-2:])}"
#tab_title_template {title if tab.active_exe == "bash" else tab.active_exe}

### -------------------------- Keyboard shortcuts ------------------------- ###
# https://sw.kovidgoyal.net/kitty/keyboard-protocol/
# There are various problems with the current state of keyboard handling in bash. They include:
# - No way to use modifiers other than ctrl and alt
# - No way to reliably use multiple modifier keys, other than, shift+alt and ctrl+alt.

# Alternative meta/modifier key
kitty_mod ctrl+cmd
map cmd+a send_key alt+a
map cmd+b send_key alt+b
map cmd+c send_key alt+c
map cmd+d send_key alt+d
map cmd+e send_key alt+e
map cmd+f send_key alt+f
map cmd+g send_key alt+g
map cmd+h send_key alt+h
map cmd+i send_key alt+i
map cmd+j send_key alt+j
map cmd+k send_key alt+k
map cmd+l send_key alt+l
map cmd+m send_key alt+m
map cmd+n send_key alt+n
map cmd+o send_key alt+o
map cmd+p send_key alt+p
map cmd+q send_key alt+q
map cmd+r send_key alt+r
map cmd+s send_key alt+s
map cmd+t send_key alt+t
map cmd+u send_key alt+u
map cmd+v send_key alt+v
map cmd+w send_key alt+w
map cmd+x send_key alt+x
map cmd+y send_key alt+y
map cmd+z send_key alt+z
map cmd+0 send_key alt+0
map cmd+1 send_key alt+1
map cmd+2 send_key alt+2
map cmd+3 send_key alt+3
map cmd+4 send_key alt+4
map cmd+5 send_key alt+5
map cmd+6 send_key alt+6
map cmd+7 send_key alt+7
map cmd+8 send_key alt+8
map cmd+9 send_key alt+9
map cmd+; send_key alt+;
map cmd+. send_key alt+.
map cmd+/ send_key alt+/

# Application windows
#map cmd+n new_os_window
#map kitty_mod+n new_os_window

# unmap close window actions
map cmd+w
map cmd+shift+w
map cmd+ctrl+w
map cmd+ctl+shift+w
map cmd+shift+d send_key alt+D

map ctrl+shift+cmd+t set_tab_title
map ctrl+cmd+,       move_tab_backward
map ctrl+shift+cmd+, move_tab_backward
map ctrl+cmd+.       move_tab_forward
map ctrl+shift+cmd+. move_tab_forward
