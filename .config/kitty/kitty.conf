### --------------------------------- URL --------------------------------- ###
# disable simple left click URL-opening
mouse_map            left click   ungrabbed

# disable modifiers left click URLs
mouse_map            left click   ungrabbed         mouse_handle_click selection prompt
mouse_map      shift+left click   grabbed,ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click selection prompt

# triple click to select entire line
mouse_map            left triplepress ungrabbed     mouse_selection    line

detect_urls off
open_url_with default
url_style single

### ------------------------ Configuration imports ------------------------ ###
#include dracula.conf
